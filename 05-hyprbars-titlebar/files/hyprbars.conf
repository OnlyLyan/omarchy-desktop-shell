# Barra de título com botões (plugin hyprbars)
# Docs: https://github.com/hyprwm/hyprland-plugins/tree/main/hyprbars

plugin {
    hyprbars {
        bar_height = 28
        bar_padding = 10
        bar_button_padding = 8
        bar_text_size = 11
        bar_text_font = JetBrainsMono Nerd Font
        # centralizado para nao colidir com a faixa de ferramentas, que fica na esquerda
        bar_text_align = center
        bar_part_of_window = true
        bar_precedence_over_border = true

        # Barra no escuro padrão (sem bar_color/col.text forçados)

        # Botões da DIREITA para a ESQUERDA (1a linha = mais a direita).
        # Formato: hyprbars-button = <cor-fundo>, <tamanho>, <ícone>, <comando>, <cor-ícone>
        # Ordem na tela (esq -> dir): fechar (vermelho), minimizar (amarelo),
        # maximizar (verde), guardar na gaveta (azul).

        # Icones Material Design da Nerd Font: desenhados como conjunto unico,
        # mesmo peso de traco e mesma caixa optica (o problema dos glifos antigos
        # era serem de familias diferentes: losango fino + chevron + X pesado).
        # Cor do icone e um tom escuro do proprio botao, nao preto puro, pra nao
        # ficar duro sobre a cor saturada.

        # Azul -> guarda a janela na gaveta (GavetaPanel.qml).
        # Este botao E o gatilho da gaveta desde 2026-08-14: NENHUM bind de mouse
        # dispara neste Hyprland, nem o `movewindow` de fabrica do Omarchy, entao
        # SUPER+CTRL+clique na barra nunca chegava a ser avaliado.
        # Fica na ponta DIREITA, o mais longe possivel do vermelho de fechar.
        hyprbars-button = rgb(5c8fe0), 17, 󰇚, /home/lucas/.config/quickshell/scripts/gaveta.sh botao, rgb(0d1b33)

        # Verde -> maximiza / restaura
        hyprbars-button = rgb(5fb85c), 17, 󰖯, hyprctl dispatch fullscreen 1, rgb(11330f)

        # Amarelo -> minimiza; restaura com SUPER+ALT+M
        hyprbars-button = rgb(dfc04a), 17, 󰖰, /home/lucas/.local/bin/window-minimize, rgb(3a2f06)

        # Vermelho -> fecha a janela
        hyprbars-button = rgb(e05c5c), 17, 󰖭, hyprctl dispatch killactive, rgb(3d0f0f)
    }
}
