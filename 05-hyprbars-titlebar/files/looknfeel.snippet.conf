# -> ~/.config/hypr/looknfeel.conf (ao final)
# Fix do reflow ao minimizar: no dwindle, minimizar/fechar uma janela faz as OUTRAS tiladas
# da mesma tela se reorganizarem (a arvore inteira se rearranja pra preencher o buraco).
# Nenhum layout de tiling "mantem o buraco". O layout master torna o reflow previsivel:
# a janela master fica fixa de um lado e so a pilha se reajusta.
general {
    layout = master
}

# https://wiki.hypr.land/Configuring/Master-Layout/
master {
    # Janela nova entra na PILHA, mantendo a master atual no lugar (estabilidade).
    new_status = slave
    # Master ocupa 55% da largura.
    mfact = 0.55
    # Master a esquerda, pilha a direita.
    orientation = left
}
